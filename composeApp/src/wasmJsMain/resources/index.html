<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#B4372F">
    <meta name="description" content="Good Company — a CRM for your friends.">
    <!-- Google Drive backup (optional): a Google Cloud "Web application" OAuth client ID whose authorized
         JavaScript origins include this site. Empty = the feature is hidden. See docs/GOOGLE_DRIVE.md. -->
    <meta name="google-drive-client-id" content="">
    <title>Good Company</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #FFF8F6; }
        @media (prefers-color-scheme: dark) { html, body { background: #1A1110; } }
        #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 18px system-ui, sans-serif; color: #B4372F; }
    </style>
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
<div id="loading">Good Company…</div>
<script>new MutationObserver(() => { if (document.querySelector('canvas')) document.getElementById('loading')?.remove(); })
    .observe(document.body, { childList: true, subtree: true });</script>
</body>
</html>
