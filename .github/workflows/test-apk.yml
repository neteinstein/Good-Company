# Releases for every merge to main — see CI_CD.md ("Releases").
#
# Runs after the CI workflow succeeds on a push to main (a merged PR), so only green code is published.
# Builds the Play (`release`) and `sideload` APKs and the Play bundle (AAB), signs them, and publishes them as the
# rolling GitHub release tagged v0.1.<n> (the first is v0.1.0; marked "latest") plus a workflow artifact.
# With the release keystore and PLAY_STORE_SERVICE_ACCOUNT_JSON secrets it also uploads that bundle
# (versionCode = this run's number) to Google Play's internal track. publish-play-store.yml promotes it further.
name: Test APK

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Only the newest merge matters: a newer run replaces an older one that is still building.
concurrency:
  group: test-apk
  cancel-in-progress: true

permissions:
  contents: write # create the release

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  JAVA_VERSION: "21"

jobs:
  test-apk:
    name: Build and publish test APKs
    # Only after a green CI run triggered by a push to main. A workflow_run from a pull request (even a fork's
    # branch called "main") never gets here, so secrets are only used on code that is already on main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      # Versions run 0.1.0, 0.1.1, ...: the patch is one above the newest v0.1.* release (none yet = 0.1.0).
      - name: Next version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | sed -n 's/^v0\.1\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
          PATCH=$(( ${LAST:--1} + 1 ))
          echo "VERSION=0.1.$PATCH" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v0.1.$PATCH" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json
          else
            cp androidApp/google-services.json.ci androidApp/google-services.json
          fi

      # With the keystore secrets, builds keep one signature, so each one installs over the last.
      # Without them, the CI debug key is used: the APKs install, but testers must uninstall between builds.
      - name: Signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            } > keystore.properties
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "key=release keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets: test APKs are signed with the CI debug key (uninstall before updating)."
            echo "flag=-Pgoodcompany.signWithDebugKey=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "key=CI debug key (uninstall the previous test build first)" >> "$GITHUB_OUTPUT"
          fi

      # One Gradle run, so the APK and the bundle share the same R8 output (and mapping.txt).
      - name: Assemble release (Play) + sideload, bundle release (Play)
        run: >-
          ./gradlew :androidApp:assembleRelease :androidApp:assembleSideload :androidApp:bundleRelease
          -Pgoodcompany.versionCode=${{ env.BUILD }}
          -Pgoodcompany.versionName=${{ env.VERSION }}
          ${{ steps.signing.outputs.flag }}

      - name: Verify signatures and Play permissions
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in androidApp/build/outputs/apk/release/*.apk androidApp/build/outputs/apk/sideload/*.apk; do
            "$BT/apksigner" verify "$apk" || { echo "::error::$apk is not signed"; exit 1; }
          done
          # App bundles are jar-signed. Not -strict: upload and debug keys are self-signed, which -strict rejects.
          jarsigner -verify androidApp/build/outputs/bundle/release/*.aab | grep -q "jar verified" \
            || { echo "::error::The Play bundle is not signed"; exit 1; }
          PERMS=$("$BT/aapt2" dump permissions androidApp/build/outputs/apk/release/*.apk)
          if echo "$PERMS" | grep -E "READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CALL_LOG|READ_CONTACTS|WRITE_CONTACTS|REQUEST_INSTALL_PACKAGES|AD_ID"; then
            echo "::error::Release (Play) APK declares a restricted permission"; exit 1
          fi

      - name: Verify APKs bundle Compose resources
        run: |
          # Compose Multiplatform reads strings/fonts from APK assets; without them the app crashes on open.
          for apk in androidApp/build/outputs/apk/*/*.apk; do
            for f in core.ui.resources/values/strings.commonMain.cvr core.ui.resources/font/plus_jakarta_sans_regular.ttf \
                     feature.friends.resources/values/strings.commonMain.cvr composeApp.resources/values/strings.commonMain.cvr; do
              unzip -l "$apk" | grep -q "assets/composeResources/org.goodcompany.app.$f" \
                || { echo "::error::$apk is missing Compose resources ($f)"; exit 1; }
            done
          done

      # Stable names, so the download links on the release links stay predictable.
      - name: Collect APKs
        run: |
          mkdir dist
          cp androidApp/build/outputs/apk/release/*.apk dist/good-company-play.apk
          cp androidApp/build/outputs/apk/sideload/*.apk dist/good-company-sideload.apk
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab dist/good-company-play.aab
          cp androidApp/build/outputs/mapping/release/mapping.txt dist/mapping-play.txt
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: test-apks-${{ env.BUILD }}
          path: dist/
          retention-days: 30

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_WITH: ${{ steps.signing.outputs.key }}
        run: |
          SUBJECT=$(git log -1 --format=%s "$SHA")
          cat > notes.md <<EOF
          Release **$VERSION** (build **#$BUILD**, version \`$VERSION\`) from \`${SHA:0:7}\`: $SUBJECT

          | File | What it is |
          |---|---|
          | \`good-company-play.apk\` | The Play build: contact picker only, no call log. |
          | \`good-company-sideload.apk\` | Everything: full address-book sync and call matching. Installs next to the Play build (\`.sideload\` id). |
          | \`good-company-play.aab\` | The Play build as an Android App Bundle, for uploading to Google Play by hand. |

          Signed with: $SIGNED_WITH.
          Both are R8-optimized release builds. \`mapping-play.txt\` de-obfuscates Play-build crashes.
          Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The sideload build is not for the Play Store.
          EOF
          gh release create "$RELEASE_TAG" dist/* \
            --latest \
            --target "$SHA" \
            --title "$VERSION (build #$BUILD)" \
            --notes-file notes.md

      # Google Play: the bundle attached above (the same `release` build as good-company-play.apk), to the internal track.
      # Skipped (with a notice) until both the release keystore and the Play service account are set up,
      # so the GitHub release above never depends on Play. See CI_CD.md, "Google Play".
      - name: Google Play upload configured?
        id: play
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_STORE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::No PLAY_STORE_SERVICE_ACCOUNT_JSON secret: the bundle is not uploaded to Google Play."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.signing.outputs.release }}" != "true" ]; then
            echo "::warning::No release keystore: Play only accepts bundles signed with the upload key, so nothing is uploaded."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up the Play upload script
        if: steps.play.outputs.upload == 'true'
        run: |
          # A virtualenv: the runner's system Python refuses pip installs (PEP 668).
          python3 -m venv "$RUNNER_TEMP/play-venv"
          "$RUNNER_TEMP/play-venv/bin/pip" install --quiet google-auth==2.61.0 requests==2.32.5
          (cd .github/scripts && "$RUNNER_TEMP/play-venv/bin/python" -m unittest test_play_publish)

      # Not r0adkll/upload-google-play: Play requires or refuses changesNotSentForReview depending on the
      # app's publishing state, so the script picks it per upload (see its docstring).
      - name: Upload the Play bundle to the internal track
        if: steps.play.outputs.upload == 'true'
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-store-key.json"
          "$RUNNER_TEMP/play-venv/bin/python" .github/scripts/play_publish.py \
            --key "$RUNNER_TEMP/play-store-key.json" \
            --package org.goodcompany.app \
            --aab dist/good-company-play.aab \
            --mapping dist/mapping-play.txt \
            --release-notes store-listing/text \
            --track internal

      - name: Remove secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/play-store-key.json" "$RUNNER_TEMP/release.jks" keystore.properties

      - name: Summary
        env:
          SIGNED_WITH: ${{ steps.signing.outputs.key }}
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$RELEASE_TAG"
          {
            echo "### Release $VERSION (build #$BUILD (\`${SHA:0:7}\`)"
            echo ""
            echo "- Play build: $URL/good-company-play.apk"
            echo "- Sideload build: $URL/good-company-sideload.apk"
            echo "- Play bundle: $URL/good-company-play.aab"
            echo "- Signed with: $SIGNED_WITH"
            echo "- Google Play internal track: ${{ steps.play.outputs.upload == 'true' && 'uploaded (see above)' || 'not uploaded' }}"
          } >> "$GITHUB_STEP_SUMMARY"
